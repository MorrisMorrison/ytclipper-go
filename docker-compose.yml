services:
  ytclipper:
    build: .
    ports:
      - "8080:8080"
    environment:
      - YTCLIPPER_PORT=8080
      - YTCLIPPER_DEBUG=false
    volumes:
      # A named volume keeps the image's ownership, so the non-root user can write.
      - clips:/app/videos
    restart: unless-stopped

volumes:
  clips:

name: CI

# Unit tests, then the e2e suite against the real app with fake yt-dlp and
# ffmpeg binaries (test/fakes). CI never calls real YouTube: datacenter IPs get
# bot-blocked, so it would be flaky and meaningless. The fakes exercise the full
# flow offline.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format, vet, test, build
        run: make check
      - name: Race detector
        run: go test -race ./...

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Builds the app and the fakes, starts and stops its own servers.
      - name: Run e2e suite
        run: make e2e
      # Failure screenshots, console logs and the server logs.
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test/e2e/artifacts/
          if-no-files-found: ignore

  docker:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

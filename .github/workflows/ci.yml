name: CI

# Unit tests, then the e2e suite against the real app with a deterministic
# yt-dlp stub. CI never calls real YouTube: datacenter IPs get bot-blocked, so
# it would be flaky and meaningless. The stub exercises the full flow offline.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format, vet, test, build
        run: make check
      - name: Race detector
        run: go test -race ./...

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YTCLIPPER_CLIP_CLEANUP_SCHEDULER_ENABLED: "false"
      YTCLIPPER_YT_DLP_COMMAND_TIMEOUT_IN_SECONDS: "15"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Put the yt-dlp stub on PATH
        run: |
          chmod +x test/ci/yt-dlp
          echo "$GITHUB_WORKSPACE/test/ci" >> "$GITHUB_PATH"
      - name: Start server
        run: |
          yt-dlp --version
          go build -o ytclipper .
          nohup ./ytclipper > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          echo "Server failed to start"; cat server.log; exit 1
      - name: Run e2e suite
        run: make e2e
      - name: Server logs
        if: always()
        run: cat server.log

  docker:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

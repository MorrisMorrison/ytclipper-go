name: CI

# Unit tests, then the e2e suite against the real app with fake yt-dlp and
# ffmpeg binaries (test/fakes). CI never calls real YouTube: datacenter IPs get
# bot-blocked, so it would be flaky and meaningless. The fakes exercise the full
# flow offline.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format, vet, test, build
        run: make check
      - name: Race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage-unit.out ./...
      - name: Upload unit coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage-unit.out
          flags: unit
          use_oidc: true
          fail_ci_if_error: false

  e2e:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Builds the app (with -cover) and the fakes, starts and stops its own
      # servers, and converts their coverage data into coverage-e2e.out.
      - name: Run e2e suite with coverage
        run: make coverage-e2e
      - name: Upload e2e coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage-e2e.out
          flags: e2e
          use_oidc: true
          fail_ci_if_error: false
      # Failure screenshots, console logs and the server logs.
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test/e2e/artifacts/
          if-no-files-found: ignore

  docker:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
